name: Build Oistins

# Every push to main / manual run: apps downloadable from the run's "Artifacts".
# Pushing a tag like v1.0.0: also attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows, sep: ";" }
          - { os: macos-latest, target: macos, sep: ":" }
          - { os: ubuntu-latest, target: linux, sep: ":" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt scapy maxminddb pyinstaller
      - name: Build
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --name Oistins \
            --add-data "web${{ matrix.sep }}web" \
            --hidden-import scapy.all --collect-submodules scapy oistins.py
      - name: Package
        shell: bash
        run: |
          cp README.md LICENSE dist/
          cd dist
          if [ "${{ matrix.target }}" = "windows" ]; then 7z a ../Oistins-windows.zip .; else zip -r ../Oistins-${{ matrix.target }}.zip .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Oistins-${{ matrix.target }}
          path: Oistins-${{ matrix.target }}.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Oistins-${{ matrix.target }}.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk Oistins-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oistins-android
          path: Oistins-android.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Oistins-android.apk
